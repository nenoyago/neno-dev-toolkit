name: 🦋 Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  CI: true
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version-and-pr:
    name: 📝 Version Packages & Create PR
    environment: Semver
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: 'pnpm'

      - name: ⚡ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌿 Create release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          NEW_BRANCH="release/auto-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $NEW_BRANCH
          echo "NEW_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV

      - name: 📝 Check for changesets
        id: check
        run: |
          # Verifica se existem changesets
          if [ ! "$(ls -A .changeset/*.md 2>/dev/null | grep -v 'README.md' | grep -v 'config.json')" ]; then
            echo "✅ No changesets found"
            echo "CHANGES=false" >> $GITHUB_ENV
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Verifica se há changesets vazios (apenas com empty: true)
          EMPTY_COUNT=0
          REAL_COUNT=0

          for file in .changeset/*.md; do
            if [ "$file" = ".changeset/README.md" ]; then
              continue
            fi
            
            # Verifica se o changeset tem pacotes listados (não é vazio)
            if grep -q "^'@" "$file" 2>/dev/null || grep -q '^"@' "$file" 2>/dev/null; then
              REAL_COUNT=$((REAL_COUNT + 1))
            else
              EMPTY_COUNT=$((EMPTY_COUNT + 1))
            fi
          done

          echo "📊 Changesets encontrados:"
          echo "  - Real changesets: $REAL_COUNT"
          echo "  - Empty changesets: $EMPTY_COUNT"

          if [ $REAL_COUNT -eq 0 ]; then
            echo "🧹 Only empty changesets found - will clean them up"
            echo "CHANGES=true" >> $GITHUB_ENV
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 Real changesets found, proceeding with release"
            echo "CHANGES=true" >> $GITHUB_ENV
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Version packages
        if: env.CHANGES == 'true'
        run: pnpm changeset version

      - name: 💾 Commit version changes
        if: env.CHANGES == 'true'
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
              git commit -m "release: 🔖 update package versions [skip ci]"
            else
              git commit -m "chore: 🤖 remove empty changesets [skip ci]"
            fi
            echo "📦 Changes committed"
          fi

      - name: ⬆️ Push release branch
        if: env.CHANGES == 'true'
        run: git push origin $NEW_BRANCH

      - name: 🏷️ Ensure release labels exist
        if: env.CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh label create "🤖 automated" --color A855F7 --description "Automated changes" --force || true
          gh label create "🚀 release" --color 22C55E --description "Package releases" --force || true
          gh label create "🧹 chore" --color F59E0B --description "Maintenance and cleanup tasks" --force || true
          gh label create "👷 ci" --color 3B82F6 --description "CI/CD changes" --force || true

      - name: 📬 Create Release PR
        if: env.CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔄 Creating pull request for branch: $NEW_BRANCH"

          if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
            TITLE="release: 🔖 automated package version updates"
            BODY="## 📦 Automated Package Release

          This PR contains automated version updates based on changesets.

          ### 🔄 Changes
          - 🔖 Version bumps for affected packages
          - 📝 Updated CHANGELOG files
          - ✅ Ready for publication

          ### ⚙️ Workflow
          - Generated by: GitHub Actions
          - Trigger: Changesets detected in main branch
          - Next step: Automatic publication after merge

          ---
          *🤖 This is an automated pull request created by the release workflow*"
            LABELS="🤖 automated,🚀 release,👷 ci"
          else
            TITLE="chore: 🤖 remove empty changesets"
            BODY="## 🧹 Changesets Cleanup

          This PR removes empty changesets that don't contain any package changes.

          ### 🔄 Changes
          - ⚰️ Remove empty changeset files
          - ❌ No version updates
          - ❌ No publications

          ### ⚙️ Workflow
          - Generated by: GitHub Actions
          - Trigger: Empty changesets detected
          - Next step: Automatic merge and cleanup

          ---
          *🤖 This is an automated pull request created by the release workflow*"
            LABELS="🤖 automated,🧹 chore,👷 ci"
          fi

          PR_INFO=$(gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head $NEW_BRANCH \
            --label "$LABELS")

          PR_NUMBER=$(echo "$PR_INFO" | grep -oE '[0-9]+' | head -1)
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

          echo "🎉 Pull Request created successfully!"
          echo "📝 PR Number: #$PR_NUMBER"
          echo "🔗 PR URL: $PR_URL"
          echo "🌿 Branch: $NEW_BRANCH → main"
          echo "📋 Full response:"
          echo "$PR_INFO"

      - name: ⏱️ Wait for PR checks
        if: env.CHANGES == 'true'
        run: sleep 15

      - name: 🔀 Merge Release PR
        if: env.CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "🔄 Merging PR #$PR_NUMBER with admin privileges..."
            
            if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
              MERGE_MSG="release: 🔖 merge automated version updates [skip ci]"
            else
              MERGE_MSG="chore: 🤖 merge changesets cleanup [skip ci]"
            fi
            
            gh pr merge $PR_NUMBER \
              --merge \
              --admin \
              --delete-branch \
              --body "$MERGE_MSG"
            echo "✅ PR merged successfully"
          else
            echo "❌ PR number not found"
            exit 1
          fi

  publish:
    name: 📦 Publish packages
    environment: Semver
    runs-on: ubuntu-latest
    env:
      # Folder under projects/, not the npm name: the name is scoped per repo
      # (@gruposaltaedu/liv-design-system) while the
      # folder is what `build:storybook` targets (ng run design-system:...).
      DESIGN_SYSTEM_DIR: design-system
    needs: version-and-pr
    if: |
      needs.version-and-pr.outputs.has_changes == 'true' &&
      needs.version-and-pr.outputs.should_publish == 'true' &&
      needs.version-and-pr.result == 'success'
    outputs:
      design_system_published: ${{ steps.publish_status.outputs.design_system_published }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: 🔄 Pull latest changes from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git pull origin main
          echo "✅ Main branch updated"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: ⚡ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build all packages
        run: pnpm run build:packages

      - name: 📊 Snapshot registry versions before publish
        env:
          # Reading a private package needs auth just like publishing does.
          # Without this the npm view calls below 401 and every package looks
          # like a first publish, which would deploy Storybook on every run.
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          # Self-contained on purpose: this workflow also runs in repos that
          # don't carry scripts/workspace-packages/, where importing that helper
          # died with ERR_MODULE_NOT_FOUND. Same filter it applies: publishable
          # means not private, with a publishConfig.registry, name and version.
          #
          # Written to a file rather than piped into `while` via process
          # substitution: `set -e` does not catch failures inside `< <(...)`, so
          # a broken lookup used to leave the loop with no input and the summary
          # silently reporting "0 of 0" while skipping the Storybook deploy.
          # Emits `dir<TAB>name<TAB>version`. The directory is what identifies the
          # design-system package downstream: its npm name carries a per-repo
          # scope (@gruposaltaedu/liv-design-system, @nenoyago/design-system),
          # so matching on the name skipped the Storybook deploy in other repos.
          node --input-type=commonjs -e '
            const fs = require("fs");
            const path = require("path");
            const root = "projects";
            if (!fs.existsSync(root)) process.exit(0);
            for (const dir of fs.readdirSync(root).sort()) {
              const file = path.join(root, dir, "package.json");
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (pkg.private === true) continue;
              if (!pkg.publishConfig || !pkg.publishConfig.registry) continue;
              if (!pkg.name || !pkg.version) continue;
              console.log([dir, pkg.name, pkg.version].join("\t"));
            }
          ' > /tmp/packages.txt

          if [ ! -s /tmp/packages.txt ]; then
            echo "::error::Found no publishable packages under projects/ — cannot determine what was released."
            exit 1
          fi

          : > /tmp/versions-before.tsv
          while IFS=$'\t' read -r DIR NAME LOCAL_VERSION; do
            # Only a genuine 404 means "never published". Treating any other
            # failure (401/403/network) as "none" would mark every package as a
            # first publish and deploy Storybook on a run that released nothing,
            # so anything else is a hard failure.
            if VIEW_OUTPUT=$(npm view "$NAME" version 2>&1); then
              REGISTRY_VERSION="$VIEW_OUTPUT"
            elif printf '%s' "$VIEW_OUTPUT" | grep -q 'E404'; then
              REGISTRY_VERSION="none"
            else
              echo "::error::Could not read $NAME from the registry (not a 404 — check auth/network):"
              printf '%s\n' "$VIEW_OUTPUT"
              exit 1
            fi

            printf '%s\t%s\t%s\t%s\n' "$DIR" "$NAME" "$REGISTRY_VERSION" "$LOCAL_VERSION" >> /tmp/versions-before.tsv
            echo "  $NAME ($DIR): registry=$REGISTRY_VERSION local=$LOCAL_VERSION"
          done < /tmp/packages.txt

          # Surfaced rather than silently assumed: without this directory there
          # is nothing to gate the Storybook deploy on, and it would never run.
          if cut -f1 /tmp/versions-before.tsv | grep -qx "$DESIGN_SYSTEM_DIR"; then
            echo "🎨 Storybook gate: projects/$DESIGN_SYSTEM_DIR"
          else
            echo "::warning::No projects/$DESIGN_SYSTEM_DIR package found — the Storybook deploy can never trigger in this repo."
          fi

      - name: 📦 Publish packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # pipefail is required, not decorative: the runner's default shell is
          # `bash -e` without it, so the pipe below would return sed's exit code
          # and a failed publish would pass silently.
          set -euo pipefail

          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

          # changeset's spinner emits cursor hide/show escapes (ESC[?25l / ESC[?25h).
          # The Actions log viewer eats the ESC[? prefix but renders the rest as
          # stray "25l"/"25h" text, so drop just those two sequences. Colour and
          # every other escape are left alone.
          pnpm changeset publish 2>&1 | sed -u 's/\x1b\[?25[hl]//g'
        continue-on-error: false

      - name: 🎉 Publish summary
        id: publish_status
        run: |
          set -euo pipefail

          # Derived from the pre-publish snapshot vs the versions in the tree,
          # NOT from parsing `changeset publish` stdout (that output is coloured
          # and its prefix glyph varies between TTY and CI) and NOT from a
          # post-publish `npm view` (which raced GitHub Packages' indexing and
          # used to print "Registry after: unknown" on a successful release).
          # The publish step above cannot have failed silently — it has
          # continue-on-error: false, so the job would already be red.
          if [ ! -s /tmp/versions-before.tsv ]; then
            echo "::error::Version snapshot is missing or empty — cannot report what was released."
            exit 1
          fi

          TOTAL_COUNT=$(wc -l < /tmp/versions-before.tsv | tr -d ' ')

          DS_PUBLISHED=false
          PUBLISHED_COUNT=0
          TABLE_ROWS=""
          CONSOLE_LINES=""
          UNCHANGED_LIST=""
          UNCHANGED_COUNT=0

          # Released packages carry the signal, so they get the table. Unchanged
          # ones stay listed but collapsed: dropping them entirely would hide
          # whether the snapshot actually covered every package, which is how the
          # earlier "0 of 0" bug went unnoticed.
          while IFS=$'\t' read -r DIR NAME BEFORE LOCAL; do
            if [ "$BEFORE" = "$LOCAL" ]; then
              UNCHANGED_COUNT=$((UNCHANGED_COUNT + 1))
              UNCHANGED_LIST+="- \`$NAME\` \`$LOCAL\`"$'\n'
              continue
            fi

            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
            if [ "$DIR" = "$DESIGN_SYSTEM_DIR" ]; then
              DS_PUBLISHED=true
            fi

            if [ "$BEFORE" = "none" ]; then
              TABLE_ROWS+="| \`$NAME\` | — | **\`$LOCAL\`** | 🎉 first publish |"$'\n'
              CONSOLE_LINES+="  🎉 $NAME — first publish ($LOCAL)"$'\n'
            else
              TABLE_ROWS+="| \`$NAME\` | \`$BEFORE\` | **\`$LOCAL\`** | ✅ published |"$'\n'
              CONSOLE_LINES+="  ✅ $NAME — $BEFORE → $LOCAL"$'\n'
            fi
          done < /tmp/versions-before.tsv

          echo "design_system_published=$DS_PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "published_count=$PUBLISHED_COUNT" >> "$GITHUB_OUTPUT"

          # This job finishes before the Storybook deploy does, so state the gate
          # decision as a fact and let that job report its own outcome in the
          # "🎨 Storybook deploy" section below — never claim a result here.
          if [ "$DS_PUBLISHED" = "true" ]; then
            NEXT_LINE="🎨 design-system was released, so the **Storybook deploy** was triggered — its result is in the section below."
          else
            NEXT_LINE="⏭️ Storybook deploy **not triggered** — design-system was not part of this release."
          fi

          {
            echo "## 📦 Publish summary"
            echo ""
            if [ "$PUBLISHED_COUNT" -eq 0 ]; then
              echo "**Nothing to release.** All $TOTAL_COUNT package(s) already match the versions on \`npm.pkg.github.com\`."
            else
              echo "**$PUBLISHED_COUNT of $TOTAL_COUNT package(s) released** to \`npm.pkg.github.com\`."
              echo ""
              echo "| Package | Before | After | Status |"
              echo "| :--- | :--- | :--- | :--- |"
              printf '%s' "$TABLE_ROWS"

              if [ "$UNCHANGED_COUNT" -gt 0 ]; then
                echo ""
                echo "<details>"
                echo "<summary>$UNCHANGED_COUNT package(s) unchanged</summary>"
                # Blank line required, or GitHub renders the list as literal text.
                echo ""
                printf '%s' "$UNCHANGED_LIST"
                echo ""
                echo "</details>"
              fi
            fi
            echo ""
            echo "$NEXT_LINE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PUBLISHED_COUNT" -eq 0 ]; then
            echo "📦 Publish summary — nothing to release ($TOTAL_COUNT package(s) already up to date)"
          else
            echo "📦 Publish summary — $PUBLISHED_COUNT of $TOTAL_COUNT package(s) released:"
            printf '%s' "$CONSOLE_LINES"
            if [ "$UNCHANGED_COUNT" -gt 0 ]; then
              echo "  ⏭️  $UNCHANGED_COUNT unchanged"
            fi
          fi
          echo "$NEXT_LINE"

  deploy-storybook:
    name: 🎨 Deploy Storybook
    environment: Semver
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.design_system_published == 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: 'pnpm'

      - name: ⚡ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Deploy to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: 'build:storybook'
          exitZeroOnChanges: true
          autoAcceptChanges: true
          onlyChanged: true

      # always(): the publish job already wrote "Storybook deploy will run",
      # so this section has to resolve that either way. Without it a failed
      # deploy left the summary claiming the deploy was still coming.
      - name: 🎨 Report Storybook deploy
        if: always()
        run: |
          set -euo pipefail

          STORYBOOK_URL="https://main--68e56bc427fd47846235f3f9.chromatic.com/"
          OUTCOME="${{ steps.chromatic.outcome }}"

          {
            echo "## 🎨 Storybook deploy"
            echo ""
            case "$OUTCOME" in
              success)
                echo "✅ Deployed to Chromatic — [open Storybook]($STORYBOOK_URL)"
                ;;
              skipped)
                echo "⏭️ Skipped — an earlier step in this job did not complete."
                ;;
              *)
                echo "❌ **Failed** ($OUTCOME). The packages were still published; only the Storybook deploy failed."
                echo ""
                echo "Check the **🎨 Deploy to Chromatic** step for the reason."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          case "$OUTCOME" in
            success) echo "✅ Storybook deployed: $STORYBOOK_URL" ;;
            skipped) echo "⏭️ Storybook deploy skipped" ;;
            *)       echo "❌ Storybook deploy failed ($OUTCOME) — packages were published regardless" ;;
          esac
