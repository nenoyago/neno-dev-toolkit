name: 🦋 Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  CI: true
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version-and-pr:
    name: 📝 Version Packages & Create PR
    environment: Semver
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: 'pnpm'

      - name: ⚡ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌿 Create release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          NEW_BRANCH="release/auto-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $NEW_BRANCH
          echo "NEW_BRANCH=$NEW_BRANCH" >> $GITHUB_ENV

      - name: 📝 Check for changesets
        id: check
        run: |
          # Verifica se existem changesets
          if [ ! "$(ls -A .changeset/*.md 2>/dev/null | grep -v 'README.md' | grep -v 'config.json')" ]; then
            echo "✅ No changesets found"
            echo "CHANGES=false" >> $GITHUB_ENV
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Verifica se há changesets vazios (apenas com empty: true)
          EMPTY_COUNT=0
          REAL_COUNT=0

          for file in .changeset/*.md; do
            if [ "$file" = ".changeset/README.md" ]; then
              continue
            fi
            
            # Verifica se o changeset tem pacotes listados (não é vazio)
            if grep -q "^'@" "$file" 2>/dev/null || grep -q '^"@' "$file" 2>/dev/null; then
              REAL_COUNT=$((REAL_COUNT + 1))
            else
              EMPTY_COUNT=$((EMPTY_COUNT + 1))
            fi
          done

          echo "📊 Changesets encontrados:"
          echo "  - Real changesets: $REAL_COUNT"
          echo "  - Empty changesets: $EMPTY_COUNT"

          if [ $REAL_COUNT -eq 0 ]; then
            echo "🧹 Only empty changesets found - will clean them up"
            echo "CHANGES=true" >> $GITHUB_ENV
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 Real changesets found, proceeding with release"
            echo "CHANGES=true" >> $GITHUB_ENV
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Version packages
        if: env.CHANGES == 'true'
        run: pnpm changeset version

      - name: 💾 Commit version changes
        if: env.CHANGES == 'true'
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
              git commit -m "release: 🔖 update package versions [skip ci]"
            else
              git commit -m "chore: 🤖 remove empty changesets [skip ci]"
            fi
            echo "📦 Changes committed"
          fi

      - name: ⬆️ Push release branch
        if: env.CHANGES == 'true'
        run: git push origin $NEW_BRANCH

      - name: 🏷️ Ensure release labels exist
        if: env.CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh label create "🤖 automated" --color A855F7 --description "Automated changes" --force || true
          gh label create "🚀 release" --color 22C55E --description "Package releases" --force || true
          gh label create "🧹 chore" --color F59E0B --description "Maintenance and cleanup tasks" --force || true
          gh label create "👷 ci" --color 3B82F6 --description "CI/CD changes" --force || true

      - name: 📬 Create Release PR
        if: env.CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🔄 Creating pull request for branch: $NEW_BRANCH"

          if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
            TITLE="release: 🔖 automated package version updates"
            BODY="## 📦 Automated Package Release

          This PR contains automated version updates based on changesets.

          ### 🔄 Changes
          - 🔖 Version bumps for affected packages
          - 📝 Updated CHANGELOG files
          - ✅ Ready for publication

          ### ⚙️ Workflow
          - Generated by: GitHub Actions
          - Trigger: Changesets detected in main branch
          - Next step: Automatic publication after merge

          ---
          *🤖 This is an automated pull request created by the release workflow*"
            LABELS="🤖 automated,🚀 release,👷 ci"
          else
            TITLE="chore: 🤖 remove empty changesets"
            BODY="## 🧹 Changesets Cleanup

          This PR removes empty changesets that don't contain any package changes.

          ### 🔄 Changes
          - ⚰️ Remove empty changeset files
          - ❌ No version updates
          - ❌ No publications

          ### ⚙️ Workflow
          - Generated by: GitHub Actions
          - Trigger: Empty changesets detected
          - Next step: Automatic merge and cleanup

          ---
          *🤖 This is an automated pull request created by the release workflow*"
            LABELS="🤖 automated,🧹 chore,👷 ci"
          fi

          PR_INFO=$(gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head $NEW_BRANCH \
            --label "$LABELS")

          PR_NUMBER=$(echo "$PR_INFO" | grep -oE '[0-9]+' | head -1)
          PR_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"

          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

          echo "🎉 Pull Request created successfully!"
          echo "📝 PR Number: #$PR_NUMBER"
          echo "🔗 PR URL: $PR_URL"
          echo "🌿 Branch: $NEW_BRANCH → main"
          echo "📋 Full response:"
          echo "$PR_INFO"

      - name: ⏱️ Wait for PR checks
        if: env.CHANGES == 'true'
        run: sleep 15

      - name: 🔀 Merge Release PR
        if: env.CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "🔄 Merging PR #$PR_NUMBER with admin privileges..."
            
            if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
              MERGE_MSG="release: 🔖 merge automated version updates [skip ci]"
            else
              MERGE_MSG="chore: 🤖 merge changesets cleanup [skip ci]"
            fi
            
            gh pr merge $PR_NUMBER \
              --merge \
              --admin \
              --delete-branch \
              --body "$MERGE_MSG"
            echo "✅ PR merged successfully"
          else
            echo "❌ PR number not found"
            exit 1
          fi

  publish:
    name: 📦 Publish packages
    environment: Semver
    runs-on: ubuntu-latest
    needs: version-and-pr
    if: |
      needs.version-and-pr.outputs.has_changes == 'true' &&
      needs.version-and-pr.outputs.should_publish == 'true' &&
      needs.version-and-pr.result == 'success'
    outputs:
      design_system_published: ${{ steps.publish_status.outputs.design_system_published }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Pull latest changes from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git pull origin main
          echo "✅ Main branch updated"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: ⚡ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Build all packages
        run: pnpm run build:packages

      - name: 📊 Snapshot registry versions before publish
        run: |
          set -euo pipefail

          # Read only BEFORE publishing: the registry is authoritative here, with
          # no indexing lag to race. Reusing the repo's own publishable-package
          # helper keeps this list in sync with `build:packages`.
          : > /tmp/versions-before.tsv
          while read -r NAME LOCAL_VERSION; do
            REGISTRY_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "none")
            printf '%s\t%s\t%s\n' "$NAME" "$REGISTRY_VERSION" "$LOCAL_VERSION" >> /tmp/versions-before.tsv
            echo "  $NAME: registry=$REGISTRY_VERSION local=$LOCAL_VERSION"
          done < <(node -e "
            import('./scripts/workspace-packages/publishable-workspace-packages.mjs').then((m) => {
              for (const p of m.listPublishablePackagesForDisplay()) {
                console.log(\`\${p.name} \${p.version}\`);
              }
            });
          ")

      - name: 📦 Publish packages
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          pnpm changeset publish
        continue-on-error: false

      - name: 🎉 Publish summary
        id: publish_status
        run: |
          set -euo pipefail

          # Derived from the pre-publish snapshot vs the versions in the tree,
          # NOT from parsing `changeset publish` stdout (that output is coloured
          # and its prefix glyph varies between TTY and CI) and NOT from a
          # post-publish `npm view` (which raced GitHub Packages' indexing and
          # used to print "Registry after: unknown" on a successful release).
          # The publish step above cannot have failed silently — it has
          # continue-on-error: false, so the job would already be red.
          DS_PUBLISHED=false
          PUBLISHED_COUNT=0
          TABLE_ROWS=""
          CONSOLE_LINES=""

          while IFS=$'\t' read -r NAME BEFORE LOCAL; do
            if [ "$BEFORE" = "$LOCAL" ]; then
              TABLE_ROWS+="| \`$NAME\` | \`$BEFORE\` | \`$LOCAL\` | ⏭️ unchanged |"$'\n'
              CONSOLE_LINES+="  ⏭️  $NAME — unchanged ($LOCAL)"$'\n'
              continue
            fi

            PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
            if [ "$NAME" = "@gruposaltaedu/liv-design-system" ]; then
              DS_PUBLISHED=true
            fi

            if [ "$BEFORE" = "none" ]; then
              TABLE_ROWS+="| \`$NAME\` | — | \`$LOCAL\` | 🎉 first publish |"$'\n'
              CONSOLE_LINES+="  🎉 $NAME — first publish ($LOCAL)"$'\n'
            else
              TABLE_ROWS+="| \`$NAME\` | \`$BEFORE\` | \`$LOCAL\` | ✅ published |"$'\n'
              CONSOLE_LINES+="  ✅ $NAME — $BEFORE → $LOCAL"$'\n'
            fi
          done < /tmp/versions-before.tsv

          echo "design_system_published=$DS_PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "published_count=$PUBLISHED_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$DS_PUBLISHED" = "true" ]; then
            NEXT_LINE="🎨 Next: **Deploy Storybook** will run — design-system was released."
          else
            NEXT_LINE="⏭️ Next: Storybook deploy **skipped** — design-system was not part of this release."
          fi

          {
            echo "## 📦 Publish summary"
            echo ""
            echo "**$PUBLISHED_COUNT of $(wc -l < /tmp/versions-before.tsv | tr -d ' ') package(s) released** to \`npm.pkg.github.com\`."
            echo ""
            echo "| Package | Before | After | Status |"
            echo "| :--- | :--- | :--- | :--- |"
            printf '%s' "$TABLE_ROWS"
            echo ""
            echo "$NEXT_LINE"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "📦 Publish summary — $PUBLISHED_COUNT package(s) released:"
          printf '%s' "$CONSOLE_LINES"
          echo "$NEXT_LINE"

  deploy-storybook:
    name: 🎨 Deploy Storybook
    environment: Semver
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.design_system_published == 'true'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14
          cache: 'pnpm'

      - name: ⚡ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Deploy to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: 'build:storybook'
          exitZeroOnChanges: true
          autoAcceptChanges: true
          onlyChanged: true

      - name: 🎉 Storybook deployed
        run: |
          STORYBOOK_URL="https://main--68e56bc427fd47846235f3f9.chromatic.com/"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Storybook deployed to Chromatic!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 $STORYBOOK_URL"
          echo ""

          {
            echo "## 🎨 Storybook deploy"
            echo ""
            echo "✅ Design System Storybook was deployed to Chromatic."
            echo ""
            echo "- Link: [$STORYBOOK_URL]($STORYBOOK_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
